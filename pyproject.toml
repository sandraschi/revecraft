[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revecraft"
version = "0.1.0"
description = "Binary and reverse-engineering craft workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "psutil>=5.8.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
revecraft-cli = "revecraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revecraft"]
